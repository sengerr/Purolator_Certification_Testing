$kind: http-request
description: |-
  **Freight documents (Bill of Lading, pallet labels)** — Freight documents (Bill of Lading, pallet labels)

  Checklist status: **Not yet verified**

  Expected: Not yet verified. Not sent in Production: needs a real freight shipment PIN.
url: "{{soapBase}}/EWS/V1/ShippingDocuments/ShippingDocumentsService.asmx"
method: POST
headers:
  Content-Type: text/xml; charset=utf-8
  SOAPAction: http://purolator.com/pws/service/v1/GetDocuments
body:
  type: xml
  content: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns="http://purolator.com/pws/datatypes/v1">
       <soapenv:Header>
          <RequestContext>
             <Version>1.6</Version>
             <Language>en</Language>
             <GroupID>1</GroupID>
             <RequestReference>{{RequestReference}}</RequestReference>
          </RequestContext>
       </soapenv:Header>
       <soapenv:Body>
          <GetDocumentsRequest>
             <DocumentCriterium>
                <DocumentCriteria>
                   <PIN>
                      <Value>{{Freight_PIN}}</Value>
                   </PIN>
                   <!-- Leave DocumentTypes empty to receive every document for the freight shipment
                        (Bill of Lading, pallet labels regular and thermal). -->
                   <DocumentTypes />
                </DocumentCriteria>
             </DocumentCriterium>
          </GetDocumentsRequest>
       </soapenv:Body>
    </soapenv:Envelope>
order: 32000
