$kind: http-request
description: |-
  **Get Shipment Manifest Document** — GetShipmentManifestDocument

  Checklist status: **Verified**

  Expected: Verified in Development / Certification. HTTP 200 · GetShipmentManifestDocumentResponse · ResponseInformation/Errors empty · DocumentStatus = Completed · document URL returned · ManifestBatches returned
url: "{{soapBase}}/EWS/V1/ShippingDocuments/ShippingDocumentsService.asmx"
method: POST
headers:
  Content-Type: text/xml; charset=utf-8
  SOAPAction: http://purolator.com/pws/service/v1/GetShipmentManifestDocument
body:
  type: xml
  content: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns="http://purolator.com/pws/datatypes/v1">
        <soapenv:Header>
            <RequestContext>
                <!--type: string-->
                <Version>1.6</Version>
                <!--type: Language - enumeration: [en,fr]-->
                <Language>en</Language>
                <!--type: string-->
                <GroupID></GroupID>
                <!--type: string-->
                <RequestReference></RequestReference>
                <!--Optional:-->
                <!--type: string-->
                <UserToken></UserToken>
            </RequestContext>
        </soapenv:Header>
        <soapenv:Body>
            <GetShipmentManifestDocumentRequest>
                <ShipmentManifestDocumentCriterium>
                    <!--Zero or more repetitions:-->
                    <ShipmentManifestDocumentCriteria>
                        <!--type: string-->
                        <ManifestDate>{{Current_Date}}</ManifestDate>
                    </ShipmentManifestDocumentCriteria>
                </ShipmentManifestDocumentCriterium>
            </GetShipmentManifestDocumentRequest>
        </soapenv:Body>
    </soapenv:Envelope>

    <!-- Customer should check for <DocumentStatus>Pending</DocumentStatus>. If it shows pending, they need to recheck after a second until it changes to 'Completed'" -->
order: 10000
