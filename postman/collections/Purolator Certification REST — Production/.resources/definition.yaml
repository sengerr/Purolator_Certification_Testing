$kind: collection
description: |-
  Purolator REST certification checklist — **Production** (https://shipapi.purolator.com).

  Generated from samples/index.csv by tooling/build-postman.js — do not edit by hand.

  Credentials and account numbers are NOT stored here. Create your own local Postman environment (never committed) with: REST_ClientId, REST_Secret, REST_XApiKey, AccountNumber, Different_AccountNumber, Freight_account.

  > **Production creates real, billable shipments.** Void everything you create.
variables:
  restBase: https://shipapi.purolator.com
  authScope: portal_api
  REST_Token: ""
  PIN: ""
scripts:
  - type: beforeRequest
    code: |-
      // Purolator validates the shipment date in ITS timezone (Toronto), so build
      // Current_Date there, not in the machine's local time. en-CA gives yyyy-mm-dd.
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      pm.variables.set('Current_Date', now.toLocaleDateString('en-CA', { timeZone: 'America/Toronto' }));
      // REQ + YYYYMMDDHHMMSS, the same RequestReference convention as Purolator_2026.
      pm.variables.set('RequestReference', 'REQ' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate())
        + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds()));
    language: text/javascript
  - type: afterResponse
    code: |-
      // Keep the token and the last shipment PIN for the requests that follow.
      let body = {};
      try { body = pm.response.json(); } catch (e) { /* not JSON */ }
      if (body.access_token) pm.collectionVariables.set('REST_Token', body.access_token);
      const pin = body.shipmentPIN && (body.shipmentPIN.value || body.shipmentPIN);
      if (typeof pin === 'string') pm.collectionVariables.set('PIN', pin);
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
auth:
  - id: 42d38d94-5437-0554-931d-0ad84cb5db42
    type: bearer
    name: bearer auth
    credentials:
      token: "{{REST_Token}}"
